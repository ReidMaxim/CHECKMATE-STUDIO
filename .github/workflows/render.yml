name: Test and render sample
on:
  push:
    branches: [mission-001-cinematic-renderer, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install video verification tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: npm run build
      - run: npm run render
      - run: python scripts/verify-video.py out/legal-mate.mp4
      - uses: actions/upload-artifact@v5
        with:
          name: sample-video
          path: out/legal-mate.mp4
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: dashboard-build
          path: dist
          if-no-files-found: error
          retention-days: 14
