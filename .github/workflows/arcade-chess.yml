name: Render ARCADE//CHESS prototype
on:
  push:
    branches: [mission-002-a-arcade-chess]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    strategy:
      fail-fast: false
      matrix:
        cut: [arcade-chess, arcade-chess-impact]
    runs-on: ubuntu-24.04
    env:
      CUT: ${{ matrix.cut }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Install audio and video tooling
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - name: Verify announcer mix and Mission 002 evidence
        run: python scripts/arcade_audio.py --prepared
      - run: npm test
      - run: npm run build
      - name: Render and measure wall time
        run: |
          start=$(date +%s)
          npm run render -- "$CUT"
          printf '%s %s seconds\n' "$CUT" "$(( $(date +%s) - start ))" | tee out/render-time.txt
      - run: python scripts/verify-video.py "out/$CUT.mp4" out/arcade-format.json
      - name: Check audio headroom
        run: |
          ffmpeg -hide_banner -i "out/$CUT.mp4" -vn -af volumedetect -f null - 2>out/arcade-audio-check.txt
          python -c 'import re; from pathlib import Path; peak=float(re.search(r"max_volume: (-?[\d.]+) dB",Path("out/arcade-audio-check.txt").read_text())[1]); print(f"Audio peak {peak} dBFS"); assert -12 <= peak <= -1'
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.cut }}
          path: |
            out/${{ matrix.cut }}.mp4
            out/render-time.txt
            out/arcade-audit.json
          retention-days: 30
          if-no-files-found: error
