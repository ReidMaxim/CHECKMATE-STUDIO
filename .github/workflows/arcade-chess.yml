name: Render ARCADE//CHESS prototype
on:
  push:
    branches: [mission-002-a-arcade-chess]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - name: Install audio and video tooling
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1.0-int8-6e742170-bca610b8
      - name: Generate announcer and verify Mission 002 evidence
        env:
          KOKORO_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements-voice.txt
          bash scripts/fetch-kokoro.sh
          python scripts/arcade_audio.py
      - run: npm test
      - run: npm run build
      - run: npm run render -- arcade-chess
      - run: python scripts/verify-video.py out/arcade-chess.mp4 out/arcade-format.json
      - name: Check audio headroom
        run: |
          ffmpeg -hide_banner -i out/arcade-chess.mp4 -vn -af volumedetect -f null - 2>out/arcade-audio-check.txt
          python -c 'import re; from pathlib import Path; peak=float(re.search(r"max_volume: (-?[\d.]+) dB",Path("out/arcade-audio-check.txt").read_text())[1]); print(f"Audio peak {peak} dBFS"); assert -12 <= peak <= -1'
      - uses: actions/upload-artifact@v5
        with:
          name: arcade-chess-prototype
          path: |
            out/arcade-chess.mp4
            out/arcade-audit.json
          retention-days: 30
          if-no-files-found: error
