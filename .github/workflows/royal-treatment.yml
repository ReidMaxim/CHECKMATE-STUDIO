name: Package The Royal Treatment
on:
  push:
    branches: [mission-005-4-royal-treatment]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: 45113500379
          name: final-move-review
          path: out/approved-master
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg jq imagemagick fonts-liberation
      - run: scripts/royal-treatment.sh out/approved-master
      - uses: actions/upload-artifact@v5
        with:
          name: royal-treatment-launch-kit
          path: out/royal-treatment
          if-no-files-found: error
