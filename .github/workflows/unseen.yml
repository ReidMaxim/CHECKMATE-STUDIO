name: Produce unseen-game documentary
on:
  push:
    branches: [mission-004-unseen-game, mission-004-1-human-commentary, mission-004-2-producers-room]
  workflow_dispatch:
    inputs:
      producer_stage:
        description: Producer's Room stage on the Producer branch
        type: choice
        options: [full, producer, script, auditions, regression]
        default: full
      producer_pick:
        description: Optional producer candidate, e.g. opera:ply-33
        type: string
      narration_voice:
        description: Provisional render voice
        type: choice
        options: [af_heart, am_michael]
        default: af_heart
      pgn_path:
        description: Repository-relative PGN path (blank runs both demonstrations)
        type: string
      pgn_text:
        description: Optional pasted PGN score (takes precedence over path)
        type: string
      mode:
        description: Auto uses hosted AI when configured; live requires credentials
        type: choice
        options: [auto, offline, live]
        default: auto
      candidate:
        description: Optional critical moment ID
        type: string
      treatment:
        description: Optional editorial treatment
        type: choice
        options: [automatic, decision, consequence, geometry]
        default: automatic
permissions:
  contents: read
jobs:
  produce:
    name: Produce ${{ matrix.production }}
    strategy:
      fail-fast: false
      matrix:
        production: ${{ fromJSON(github.ref_name == 'mission-004-2-producers-room' && '["producers-room"]' || (inputs.pgn_path || inputs.pgn_text) && '["supplied"]' || '["opera","rook-ending"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: |
          npm ci
          python -m pip install -r requirements.txt -r requirements-voice.txt
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .cache/kokoro
            .cache/stockfish
          key: unseen-fp32-${{ hashFiles('scripts/install-stockfish.sh', 'scripts/fetch-kokoro.sh') }}
      - run: |
          bash scripts/install-stockfish.sh
          bash scripts/fetch-kokoro.sh --fp32
        env:
          KOKORO_DOWNLOAD_TOKEN: ${{ github.token }}
      - run: npm test
        env:
          STOCKFISH_INTEGRATION: '1'
      - name: Analyze, direct and synthesize
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
          MODE: ${{ inputs.mode || 'auto' }}
          PGN_PATH: ${{ inputs.pgn_path }}
          PGN_TEXT: ${{ inputs.pgn_text }}
          PRODUCTION: ${{ matrix.production }}
          CANDIDATE: ${{ inputs.candidate }}
          TREATMENT: ${{ inputs.treatment }}
          PRODUCER_STAGE: ${{ inputs.producer_stage || 'full' }}
          PRODUCER_PICK: ${{ inputs.producer_pick }}
          NARRATION_VOICE: ${{ inputs.narration_voice || 'af_heart' }}
        run: |
          if [ -n "$PGN_TEXT" ]; then
            PGN_PATH="$RUNNER_TEMP/input.pgn"
            printf '%s\n' "$PGN_TEXT" > "$PGN_PATH"
          fi
          if [ "$PRODUCTION" = producers-room ]; then
            scores=(examples/unseen/opera.pgn examples/chess/deep-blue.pgn examples/unseen/lasker-bauer.pgn)
            if [ -n "$PGN_PATH" ]; then scores=("$PGN_PATH"); fi
            python scripts/producer.py "${scores[@]}" --output out/production --mode "$MODE" \
              --stage "$PRODUCER_STAGE" --pick "$PRODUCER_PICK" --voice "$NARRATION_VOICE"
            exit
          fi
          args=()
          if [ -n "$CANDIDATE" ]; then args+=(--candidate "$CANDIDATE"); fi
          if [ -n "$TREATMENT" ] && [ "$TREATMENT" != automatic ]; then args+=(--treatment "$TREATMENT"); fi
          if [ "${GITHUB_REF_NAME}" = mission-004-1-human-commentary ]; then
            args+=(--edition commentary)
            if [ "$PRODUCTION" = opera ] && [ -z "$CANDIDATE" ]; then args+=(--candidate ply-33); fi
          else
            args+=(--edition replay)
          fi
          python scripts/unseen.py "${PGN_PATH:-examples/unseen/$PRODUCTION.pgn}" --output out/production --mode "$MODE" "${args[@]}"
      - run: npm run build
        if: matrix.production != 'producers-room' || (inputs.producer_stage || 'full') == 'full'
      - name: Render with pinned Chromium
        if: matrix.production != 'rook-ending' && (matrix.production != 'producers-room' || (inputs.producer_stage || 'full') == 'full')
        run: |
          if [ ! -s projects/unseen-documentary.json ]; then
            echo "A story was not selected for rendering"
            exit 0
          fi
          npm install --prefix "$RUNNER_TEMP/story-browser" --no-audit --no-fund @sparticuz/chromium@141.0.0
          export CHROMIUM_BIN=$(node --input-type=module -e 'const c=(await import(process.env.RUNNER_TEMP+"/story-browser/node_modules/@sparticuz/chromium/build/esm/index.js")).default; process.stdout.write(await c.executablePath())')
          npm run render -- unseen-documentary
          python scripts/verify-video.py out/unseen-documentary.mp4 projects/unseen-documentary.json
          cp out/unseen-documentary.mp4 out/production/
          python - <<'PY'
          import json
          from pathlib import Path
          quality = Path("out/production/quality-report.json")
          if quality.exists():
              report = json.loads(quality.read_text())
              report["technical"].update(mp4Decode=True, audioDecode=True, videoDimensions=True,
                                         captionBoundaries=True, narrationTiming=True, requiredAssets=True)
          else:
              quality = Path("out/production/manifest.json")
              report = json.loads(quality.read_text())
              report["validation"]["mp4Decode"] = True
          quality.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unseen-${{ matrix.production }}
          path: out/production
          if-no-files-found: ignore
