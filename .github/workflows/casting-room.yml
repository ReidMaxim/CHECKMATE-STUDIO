name: Cast the documentary narrator
on:
  push:
    branches: [mission-004-3-1-casting-room]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cast:
    outputs:
      shortlist: ${{ steps.cast.outputs.shortlist }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-signature.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install isolated CPU TTS and test dependencies
        run: |
          npm ci
          python -m venv "$RUNNER_TEMP/signature-venv"
          echo "$RUNNER_TEMP/signature-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/signature-venv/bin/python" -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.8.0+cpu
          "$RUNNER_TEMP/signature-venv/bin/python" -m pip install -r requirements-signature.txt
          "$RUNNER_TEMP/signature-venv/bin/python" -m pip check
          if ! command -v ffprobe || ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .cache/kokoro
            .cache/stockfish
            .cache/signature-downloads
          key: signature-models-${{ hashFiles('examples/signature/casting-profiles.json', 'scripts/fetch-signature-models.sh', 'scripts/fetch-kokoro.sh', 'scripts/install-stockfish.sh') }}
      - name: Fetch and verify model assets
        env:
          KOKORO_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          bash scripts/install-stockfish.sh
          bash scripts/fetch-kokoro.sh --fp32
          bash scripts/fetch-signature-models.sh .cache/signature-downloads --casting
      - run: npm test
        env:
          STOCKFISH_INTEGRATION: '1'
      - name: Cast and assemble selected narration tracks
        id: cast
        run: |
          python scripts/casting_room.py --models .cache/signature-downloads --output out/casting
          echo "shortlist=$(cat out/casting/shortlist.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: casting-auditions
          path: |
            out/casting/*.m4a
            out/casting/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: casting-render-inputs
          path: out/casting/render-inputs
          if-no-files-found: error
  films:
    needs: cast
    strategy:
      fail-fast: false
      matrix:
        voice: ${{ fromJSON(needs.cast.outputs.shortlist) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: |
          npm ci
          python -m pip install -r requirements.txt
          if ! command -v ffprobe || ! command -v ffmpeg; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - uses: actions/download-artifact@v5
        with:
          name: casting-render-inputs
          path: out/casting-inputs
      - name: Render and validate the frozen documentary
        env:
          VOICE: ${{ matrix.voice }}
        run: |
          source_dir="out/casting-inputs/$VOICE"
          cp "$source_dir/unseen-documentary.json" projects/
          cp "$source_dir/"*.wav public/
          npm install --prefix "$RUNNER_TEMP/story-browser" --no-audit --no-fund @sparticuz/chromium@141.0.0
          export CHROMIUM_BIN=$(node --input-type=module -e 'const c=(await import(process.env.RUNNER_TEMP+"/story-browser/node_modules/@sparticuz/chromium/build/esm/index.js")).default; process.stdout.write(await c.executablePath())')
          npm run render -- unseen-documentary
          python scripts/verify-video.py out/unseen-documentary.mp4 projects/unseen-documentary.json
          mv out/unseen-documentary.mp4 "out/$VOICE-documentary.mp4"
      - uses: actions/upload-artifact@v5
        with:
          name: casting-film-${{ matrix.voice }}
          path: out/${{ matrix.voice }}-documentary.mp4
          if-no-files-found: error
