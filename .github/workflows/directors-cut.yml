name: Render Director's Cut
on:
  push:
    branches: [mission-001-5-directors-cut, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  director:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - uses: ./.github/actions/director-audio
      - run: npm test
      - run: npm run build
      - run: npm run render -- legal-directors-cut
      - run: python scripts/verify-video.py out/legal-directors-cut.mp4 projects/legal-directors-cut.json
      - uses: actions/upload-artifact@v5
        with:
          name: directors-cut
          path: |
            out/legal-directors-cut.mp4
            out/director-timing.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v5
        with:
          name: directors-cut-dashboard
          path: dist
          if-no-files-found: error
          retention-days: 14
