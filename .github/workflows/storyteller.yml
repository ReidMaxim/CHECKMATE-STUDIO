name: Produce Storyteller documentary
on:
  push:
    branches: [mission-003-storyteller]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [offline, live]
        default: offline
      candidate:
        description: Optional candidate ID, such as ply-16
        type: string
      depth:
        description: Stockfish verification depth
        default: '17'
        type: string
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.3'
          cache: npm
      - run: |
          npm ci
          python -m pip install -r requirements.txt -r requirements-voice.txt
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: |
            .cache/kokoro
            .cache/stockfish
          key: storyteller-deps-${{ hashFiles('scripts/install-stockfish.sh', 'scripts/fetch-kokoro.sh') }}
      - run: |
          bash scripts/install-stockfish.sh
          bash scripts/fetch-kokoro.sh
        env:
          KOKORO_DOWNLOAD_TOKEN: ${{ github.token }}
      - run: npm test
        env:
          STOCKFISH_INTEGRATION: '1'
      - name: Plan, verify and generate narration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          STORY_MODEL: ${{ vars.STORY_MODEL }}
          MODE: ${{ inputs.mode || 'offline' }}
          CANDIDATE: ${{ inputs.candidate }}
          DEPTH: ${{ inputs.depth || '17' }}
        run: |
          selection=()
          if [ -n "$CANDIDATE" ]; then selection=(--candidate "$CANDIDATE"); fi
          python scripts/storyteller.py --mode "$MODE" --depth "$DEPTH" "${selection[@]}"
      - run: npm run build
      - name: Render documentary with pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/story-browser" --no-audit --no-fund @sparticuz/chromium@141.0.0
          export CHROMIUM_BIN=$(node --input-type=module -e 'const c=(await import(process.env.RUNNER_TEMP+"/story-browser/node_modules/@sparticuz/chromium/build/esm/index.js")).default; process.stdout.write(await c.executablePath())')
          npm run render -- storyteller-documentary
      - run: python scripts/verify-video.py out/storyteller-documentary.mp4 projects/storyteller-documentary.json
      - name: Mark ready for human review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("out/storyteller-review.json")
          data = json.loads(path.read_text())
          data["status"] = "ready-for-human-review"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          mkdir -p out/storyteller-package
          cp out/storyteller-{documentary.mp4,review.json,timing.json} projects/storyteller-documentary.json examples/analysis/deep-blue.json out/storyteller-package/
      - uses: actions/upload-artifact@v5
        with:
          name: storyteller-documentary
          path: out/storyteller-package
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: storyteller-dashboard
          path: dist
          if-no-files-found: error
